<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企业级HR人事后台管理系统</title>
  </head>
  <body>
    <div id="app">
      <div id="first-screen-loader">
        <style>
          #first-screen-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            z-index: 99999;
            user-select: none;
          }
          .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #409eff;
            border-radius: 50%;
            animation: fsl-spin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
          }
          .loader-title {
            margin-top: 18px;
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: 0.5px;
          }
          .loader-desc {
            margin-top: 6px;
            font-size: 12px;
            color: #94a3b8;
          }
          @keyframes fsl-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
        <div class="loader-spinner"></div>
        <div class="loader-title">HR 人力资源数字化管理系统</div>
        <div class="loader-desc">首屏资源加速装载中，请稍候...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
