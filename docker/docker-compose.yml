version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hr_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-hr_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hr_password_2026}
      POSTGRES_DB: ${DB_DATABASE:-hr_manage_db}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hr_admin} -d ${DB_DATABASE:-hr_manage_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hr_network

  redis:
    image: redis:7-alpine
    container_name: hr_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-hr_redis_2026} --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hr_redis_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hr_network

  minio:
    image: minio/minio:latest
    container_name: hr_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_2026}
      TZ: Asia/Shanghai
    volumes:
      - miniodata:/data
    networks:
      - hr_network

  backend:
    container_name: hr_backend
    restart: always
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hr_admin}
      DB_PASSWORD: ${DB_PASSWORD:-hr_password_2026}
      DB_DATABASE: ${DB_DATABASE:-hr_manage_db}
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-hr_redis_2026}
      REDIS_DB: 0
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_2026}
      MINIO_BUCKET_NAME: hr-local-files
      JWT_SECRET: ${JWT_SECRET:-hr_jwt_secret_prod_2026_super_key}
      JWT_EXPIRES_IN: 7200s
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-hr_refresh_token_secret_prod_2026_super_key}
      REFRESH_TOKEN_EXPIRES_IN: 7d
      ENABLE_RATE_LIMIT: "true"
      ENABLE_HELMET: "true"
      MASK_STACK_ERROR: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hr_network

  frontend:
    container_name: hr_frontend
    restart: always
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - hr_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  hr_network:
    driver: bridge
