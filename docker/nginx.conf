# ========================================================
# 企业级HR人事管理系统 Nginx 生产环境配置
# ========================================================

# 开启基于客户端 IP 的限流区域 (10MB 空间，单IP限制每秒 20 个请求)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name hr.company.com;
    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hr.company.com;

    # SSL 证书配置
    ssl_certificate /etc/nginx/certs/hr.company.com.crt;
    ssl_certificate_key /etc/nginx/certs/hr.company.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应标头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩传输
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript text/css application/xml text/javascript application/json image/svg+xml;
    gzip_vary on;

    # 前端静态页面托管
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 支持 Vue3 HTML5 History 动态路由刷新不 404
        try_files $uri $uri/ /index.html;
    }

    # 静态资源强缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 后端 NestJS 接口反向代理
    location /api/ {
        # 接口防刷限流 (突发缓冲 30 个)
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket 与文件流式传输
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 大文件上传超时时间配置
        client_max_body_size 50m;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
