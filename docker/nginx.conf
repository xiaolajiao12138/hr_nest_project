# ========================================================
# 企业级 HR 人事管理系统 Nginx 生产环境配置
# 支持: 纯 IP 访问、域名访问、反向代理、Vue3 History 路由防 404
# ========================================================

# 开启基于客户端 IP 的限流区域 (10MB 空间，单IP限制每秒 20 个请求)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 安全响应标头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩传输
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript text/css application/xml text/javascript application/json image/svg+xml;
    gzip_vary on;

    # 前端静态单页面应用托管
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 支持 Vue3 HTML5 History 动态路由，解决刷新后 404 问题
        try_files $uri $uri/ /index.html;
    }

    # 前端静态资源强缓存 (js/css/图片/字体等 30 天)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 后端 NestJS API 反向代理
    location /api/ {
        # 接口防刷限流 (突发缓冲 30 个请求，超出平滑延迟处理)
        limit_req zone=api_limit burst=30 nodelay;

        # 转发到 Docker 内部网络 backend 容器服务
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket 与 Server-Sent Events (SSE) 实时通知推流
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 针对长连接与文件上传调整超时参数
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 50m;
    }
}

